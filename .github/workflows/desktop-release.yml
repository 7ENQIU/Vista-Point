name: Подготовить desktop-релиз

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза, например v0.2.0"
        required: true
        type: string
      title:
        description: "Название релиза"
        required: true
        type: string

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Установить зависимости
        run: npm ci
      - name: Проверить проект
        run: npm run check
      - name: Собрать подписанные файлы черновика релиза
        uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ inputs.tag }}
          releaseName: ${{ inputs.title }}
          releaseDraft: true
          updaterJsonPreferNsis: true
          uploadUpdaterJson: true
