name: Подготовить desktop-релиз

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза, например v0.2.0"
        required: true
        type: string
      title:
        description: "Название релиза"
        required: true
        type: string

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Установить зависимости
        run: npm ci
      - name: Проверить проект
        run: npm run check
      - name: Проверить согласованность версии и тега
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json -AsHashtable)['version']
          $lockVersion = (Get-Content package-lock.json -Raw | ConvertFrom-Json -AsHashtable)['version']
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json -AsHashtable)['version']
          $cargoContent = Get-Content src-tauri/Cargo.toml -Raw
          $cargoVersion = [regex]::Match($cargoContent, '(?ms)^\[package\].*?^version\s*=\s*"([^"]+)"').Groups[1].Value
          $expectedTag = "v$packageVersion"
          if ($env:RELEASE_TAG -ne $expectedTag) { throw "Тег $env:RELEASE_TAG не совпадает с версией $packageVersion ($expectedTag)." }
          if ($lockVersion -ne $packageVersion -or $tauriVersion -ne $packageVersion -or $cargoVersion -ne $packageVersion) { throw "Версии package.json, package-lock.json, tauri.conf.json и Cargo.toml должны совпадать." }
      - name: Собрать подписанные файлы черновика релиза
        uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ inputs.tag }}
          releaseName: ${{ inputs.title }}
          releaseCommitish: ${{ github.sha }}
          releaseDraft: true
          updaterJsonPreferNsis: true
          uploadUpdaterJson: true
