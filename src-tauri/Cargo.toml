[package]
name = "vista-point"
version = "0.1.1"
description = "Локальное рабочее пространство мастера настольной ролевой игры"
authors = ["Vista Point contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "vista_point_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
